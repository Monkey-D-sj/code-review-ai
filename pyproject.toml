[project]
name = "code-review-ai"
version = "0.1.0"
description = "tree-sitter + SQLite code impact-chain analysis for AI code review"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "mcp>=2",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
community = ["leidenalg", "igraph"]

[project.scripts]
code-review-ai = "code_review_ai.cli:main"
code-review-ai-mcp = "code_review_ai.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.code-review-ai]
community_detection = true
community_weight = "hub_pruned"
diff_base = "origin/master"
exclude = ["*/test*", "*/migrations/*", "dist/*", "static/*", ".venv/*", ".claude/*", "assets/*", "node_modules/*", "*/alembic/*", "*/hmg-ai-agent-platform-backend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
