[project]
name = "code-review-ai"
version = "0.1.0"
description = "tree-sitter + SQLite code impact-chain analysis for AI code review"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "mcp>=2",
    "watchfiles>=0.21",
    "toon-format",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=14.0",
]

[project.optional-dependencies]
community = ["leidenalg", "igraph"]
deepseek = [
    "langchain-deepseek>=1",
]

# Development dependencies live in a PEP 735 group rather than an extra:
# `uv run` syncs a group by default (uv's `default-groups` is ["dev"]), while an
# extra only joins the sync when asked for -- so a bare `uv run` used to prune
# pytest and the DeepSeek provider out of the venv. The DeepSeek provider is
# repeated here because the review loop cannot be run or tested without it; the
# `deepseek` extra above stays for users who install the tool itself.
[dependency-groups]
dev = ["pytest>=8", "langchain-deepseek>=1"]

[project.scripts]
code-review-ai = "code_review_ai.cli:main"
code-review-ai-mcp = "code_review_ai.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.code-review-ai]
community_detection = true
community_weight = "hub_pruned"
diff_base = "origin/master"
exclude = ["*/migrations/*", "dist/*", "*/static/*", ".venv/*", ".claude/*", "assets/*", "node_modules/*", "*/alembic/*", "*/hmg-ai-agent-platform-backend/*", "full_agent_eval/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-repo rebuild / end-to-end runs that take seconds (skip with -m 'not slow')",
]

[tool.uv.sources]
toon-format = { git = "https://github.com/toon-format/toon-python.git" }
